<!doctype html>
<!-- Guan Yu's tactic alone, to scrub through: his own figure keeps time with the blade and the dragon.
     Served by game/serve.mjs:  /tamquoc/tools/dragon.html -->
<meta charset="utf-8">
<base href="../">
<title>Quan Vũ · Thanh Long</title>
<style>body{margin:0;background:#071b1c;color:#d7edce;font:15px system-ui;text-align:center}canvas{max-width:100%;max-height:85vh}button,input{margin:10px;accent-color:#63d6a4}button{padding:8px 16px}</style>
<h2>Thanh Long Yển Nguyệt</h2>
<button id="play">Tạm dừng</button><button id="mirror">Đổi hướng</button><input id="seek" aria-label="Tiến độ kỹ năng" type="range" min="0" max="1" step="0.001" value="0"><br>
<canvas width="540" height="600"></canvas>
<script type="module">
  import { drawEffect, effectMs, castPose } from "./src/vfx.js";
  import { VFX } from "./src/data/vfx.js";
  import { loadManifest, sprite, drawSprite, animOf, animLength } from "./src/sprites.js";
  const canvas = document.querySelector("canvas"), ctx = canvas.getContext("2d"), seek = document.querySelector("#seek"), play = document.querySelector("#play"), cfg = VFX.guanyu;
  await loadManifest();
  const guan = sprite("guanyu"), foe = sprite("gaoshun");
  let running = true, k = 0, dir = 1, last = performance.now();
  play.onclick = () => { running = !running; play.textContent = running ? "Tạm dừng" : "Chạy tiếp" };
  document.querySelector("#mirror").onclick = () => (dir *= -1);
  seek.oninput = () => { k = +seek.value; running = false; play.textContent = "Chạy tiếp" };
  function frame(now) {
    if (running) k = (k + Math.min(50, now - last) / effectMs(cfg)) % 1;
    last = now; seek.value = k;
    const side = (x) => (dir > 0 ? x : 540 - x), ms = k * effectMs(cfg);
    const env = { W: 540, H: 600, cfg, dir, now: ms, caster: { x: side(226), y: 392, tall: 125 }, targets: [262, 392, 522].map((y) => ({ x: side(390), y, tall: 100 })), beast: null };
    ctx.fillStyle = "#18312e"; ctx.fillRect(0, 0, 540, 600);
    drawEffect(ctx, "back", k, env);
    for (const t of env.targets) if (foe.ready) drawSprite(ctx, foe, "idle", ms, t.x, t.y, { scale: 100 / foe.h, faceRight: dir < 0 });
    if (guan.ready) {
      // as the battle view does: the effect leads him through his skill, then he stands
      const pose = castPose(cfg, k), anim = pose < 1 ? animOf(guan, "skill01") : "idle";
      drawSprite(ctx, guan, anim, pose < 1 ? pose * (animLength(guan, anim) - 1) : ms, env.caster.x, env.caster.y, { scale: 125 / guan.h, faceRight: dir > 0, loop: pose >= 1 });
    }
    drawEffect(ctx, "front", k, env);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
